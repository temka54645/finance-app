name: Fly Deploy Admin

on:
  push:
    branches:
      - master
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'fly.admin.toml'
      - '.github/workflows/fly-deploy-admin.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Admin to Fly.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only -a finmate-admin --config fly.admin.toml --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
